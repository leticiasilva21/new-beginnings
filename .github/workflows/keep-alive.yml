name: Keep Supabase proxy alive

on:
  schedule:
    # Every 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    # Never mark as failure — emails are sent only on failure.
    # Redeploy happens as steps within the same job when ping returns non-200.
    runs-on: ubuntu-latest
    steps:
      - name: Ping stays-proxy
        id: ping
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://ucavfotyciwnqwurzjny.supabase.co/functions/v1/stays-proxy/content/listings?limit=1&skip=0")
          echo "HTTP status: $STATUS"
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          if [ "$STATUS" != "200" ]; then
            echo "WARNING: proxy returned $STATUS — will redeploy"
          else
            echo "Proxy is healthy ✓"
          fi

      - name: Redeploy if unhealthy
        if: steps.ping.outputs.status != '200'
        uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        if: steps.ping.outputs.status != '200'
        with:
          version: latest

      - name: Redeploy edge function
        if: steps.ping.outputs.status != '200'
        run: |
          supabase functions deploy stays-proxy \
            --project-ref ucavfotyciwnqwurzjny \
            --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
