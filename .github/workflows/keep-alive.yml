name: Keep Supabase proxy alive

on:
  schedule:
    # Every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch: # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping stays-proxy
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://ucavfotyciwnqwurzjny.supabase.co/functions/v1/stays-proxy/content/listings?limit=1&skip=0")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "WARNING: proxy returned $STATUS"
            exit 1
          fi
          echo "Proxy is healthy ✓"

  redeploy-on-failure:
    runs-on: ubuntu-latest
    needs: ping
    if: failure()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Redeploy edge function
        run: |
          supabase functions deploy stays-proxy \
            --project-ref ucavfotyciwnqwurzjny \
            --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
